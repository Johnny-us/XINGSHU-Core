[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xingshu-core"
version = "0.4.0.dev0"
description = "Read-only runnable validation candidate for XINGSHU-Core"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "jsonschema>=4.23,<5",
  "rfc3339-validator>=0.1.4,<1",
]

[project.scripts]
xingshu = "xingshu_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
