[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xingshu-core"
version = "0.4.0.dev0"
description = "Core validation and explicit foreground collaboration for XINGSHU"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "jsonschema>=4.23,<5",
  "rfc3339-validator>=0.1.4,<1",
]

[project.scripts]
xingshu = "xingshu_core.cli:main"
xingshu-collab = "xingshu_collaboration.cli:main"

[tool.setuptools.package-data]
xingshu_collaboration = ["skill/SKILL.md", "skill/agents/openai.yaml", "connections/*.cjs"]

[tool.setuptools.packages.find]
where = ["src"]
