[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xingshu-core"
version = "0.4.0.dev0"
description = "Read-only runnable validator for XINGSHU-Core candidate records"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.scripts]
xingshu = "xingshu_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
